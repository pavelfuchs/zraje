<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bourání — Zraje</title>
<link rel="stylesheet" href="../../style.css">
<style>
  * { box-sizing: border-box; }
  body { background: var(--kzr-white); color: var(--kzr-brand); min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .page { max-width: 44em; margin: 0 auto; padding: 1em; }
  .header { display: flex; align-items: center; gap: .75em; margin-bottom: 1em; }
  .header a { text-decoration: none; font-size: 1.5em; }
  .header h1 { font-family: var(--font-germaniaone); font-size: 1.3em; font-weight: 400; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5em; margin-bottom: 1em; }
  .card { background: var(--kzr-grey); border-radius: .5em; padding: .5em .6em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card:active { background: var(--kzr-light); }
  .card__row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .1em; }
  .card__label { font-size: .55em; opacity: .4; text-transform: uppercase; }
  .card__val { font-size: 1em; font-weight: 700; }
  .card__val--small { font-size: .75em; font-weight: 600; }
  .card__val--green { color: #16a34a; }
  .card__val--red { color: #dc2626; }
  .qfilter { display: flex; gap: .35em; margin-bottom: .75em; flex-wrap: wrap; }
  .qbtn { padding: .35em .7em; border: 1.5px solid var(--kzr-brand); border-radius: 2em; background: none; color: var(--kzr-brand); font: inherit; font-size: .75em; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .qbtn.active { background: var(--kzr-brand); color: var(--kzr-white); }
  .parts { display: flex; flex-direction: column; gap: .4em; }
  .part { display: flex; align-items: center; padding: .7em .85em; background: var(--kzr-white); border-radius: .6em; box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; gap: .6em; -webkit-tap-highlight-color: transparent; min-height: 3.2em; }
  .part:active { background: var(--kzr-light); }
  .part-name { flex: 1; font-weight: 600; font-size: .9em; }
  .part-meta { font-size: .6em; opacity: .4; }
  .part-count { font-size: .8em; font-weight: 700; min-width: 2em; text-align: center; }
  .part-sub { font-size: .55em; opacity: .4; text-align: center; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-overlay.is-open { display: block; }
  .modal { background: var(--kzr-white); min-height: 100vh; min-height: 100dvh; padding: 1em; padding-top: calc(1em + env(safe-area-inset-top)); padding-bottom: calc(6em + env(safe-area-inset-bottom)); }
  @media (min-width: 40em) { .modal { max-width: 30em; min-height: auto; margin: 2em auto; border-radius: 1em; padding-bottom: 1.5em; } }

  .m-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: .75em; }
  .m-title { font-size: 1.2em; font-weight: 700; }
  .m-close { font-size: 2em; background: none; border: none; color: var(--kzr-brand); cursor: pointer; line-height: 1; padding: 0 .2em; }
  .m-sub { font-size: .75em; opacity: .5; margin-bottom: .75em; }

  /* Top row: photo + video side by side */
  .m-media { display: flex; gap: .5em; margin-bottom: .75em; }
  .m-media a { flex: 1; display: flex; align-items: center; justify-content: center; gap: .4em; padding: .6em; background: var(--kzr-grey); border-radius: .5em; text-decoration: none; font-size: .8em; font-weight: 600; color: var(--kzr-brand); -webkit-tap-highlight-color: transparent; }
  .m-media a:active { background: var(--kzr-light); }

  /* Compact aging row */
  .m-aging { display: flex; gap: .3em; margin-bottom: .6em; flex-wrap: wrap; align-items: center; }
  .m-pill { padding: .3em .6em; border: 1.5px solid var(--kzr-brand); border-radius: 2em; background: none; color: var(--kzr-brand); font: inherit; font-size: .7em; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .m-pill.active { background: var(--kzr-brand); color: var(--kzr-white); }
  .m-aging-input { width: 3em; font: inherit; font-size: .75em; border: 1.5px solid var(--kzr-brand); border-radius: .3em; padding: .25em; text-align: center; color: var(--kzr-brand); }
  .m-aging-label { font-size: .6em; opacity: .4; }

  /* Label desc */
  .m-label { margin-bottom: .75em; }
  .m-label label { font-size: .65em; opacity: .4; text-transform: uppercase; display: block; margin-bottom: .2em; }
  .m-label textarea { width: 100%; font: inherit; font-size: .8em; border: 1.5px solid var(--kzr-brand); border-radius: .4em; padding: .4em; color: var(--kzr-brand); min-height: 2.5em; resize: vertical; }

  /* Plus/minus bar */
  .m-pm { display: flex; align-items: center; justify-content: center; gap: .5em; margin-bottom: .75em; padding: .5em 0; }
  .m-pm-btn { width: 3.5em; height: 3.5em; border-radius: .5em; border: 2px solid var(--kzr-brand); background: none; color: var(--kzr-brand); font-size: 1.5em; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .m-pm-btn:active { background: var(--kzr-brand); color: var(--kzr-white); }
  .m-pm-btn--add { background: var(--kzr-brand); color: var(--kzr-white); }
  .m-pm-btn--add:active { opacity: .7; }
  .m-pm-count { font-size: 2em; font-weight: 700; min-width: 2em; text-align: center; }
  .m-pm-sub { font-size: .6em; opacity: .4; text-align: center; }

  /* Add form (shown after clicking +) */
  .m-add { display: none; background: var(--kzr-light); border-radius: .5em; padding: .75em; margin-bottom: .75em; }
  .m-add.is-open { display: block; }
  .m-add-row { display: flex; gap: .4em; align-items: center; }
  .m-add-row input { font: inherit; font-size: .85em; border: 1.5px solid var(--kzr-brand); border-radius: .4em; padding: .4em .5em; color: var(--kzr-brand); background: var(--kzr-white); }
  .m-add-row input[type=number] { width: 5em; }
  .m-add-row input[type=text] { flex: 1; min-width: 0; }
  .m-add-btn { padding: .45em .8em; background: var(--kzr-brand); color: var(--kzr-white); border: none; border-radius: .4em; font: inherit; font-size: .85em; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* Stocked items */
  .m-stock-title { font-size: .65em; opacity: .4; text-transform: uppercase; margin-bottom: .3em; }
  .m-item { display: flex; align-items: center; padding: .5em .6em; margin-bottom: .3em; background: var(--kzr-grey); border-radius: .4em; gap: .4em; min-height: 2.8em; }
  .m-item__info { flex: 1; }
  .m-item__weight { font-weight: 600; font-size: .9em; }
  .m-item__note { font-size: .65em; opacity: .5; }
  .m-badge { font-size: .65em; font-weight: 600; padding: .15em .45em; border-radius: 1em; white-space: nowrap; }
  .m-badge--aging { background: #fef9c3; color: #a16207; }
  .m-badge--frozen { background: #dbeafe; color: #1d4ed8; }
  .m-badge--given { background: #f3e8ff; color: #7c3aed; }
  .m-badge--own { background: #fce7f3; color: #be185d; }
  .m-badge--reserved { background: #ffedd5; color: #c2410c; }
  .m-badge--sold { background: #dcfce7; color: #15803d; }
  .m-acts { display: flex; gap: .2em; }
  .m-act { padding: .35em .5em; border-radius: .3em; border: 1.5px solid; font: inherit; font-size: .6em; font-weight: 600; cursor: pointer; background: none; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .m-act:active { opacity: .6; }
  .m-act--freeze { border-color: #3b82f6; color: #3b82f6; }
  .m-act--give { border-color: #7c3aed; color: #7c3aed; }
  .m-act--own { border-color: #be185d; color: #be185d; }
  .m-act--back { border-color: #999; color: #999; }
  .m-act--del { border-color: #dc2626; color: #dc2626; }

  /* Edit overlays */
  .edit-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 300; align-items: center; justify-content: center; }
  .edit-overlay.is-open { display: flex; }
  .edit-modal { background: var(--kzr-white); border-radius: .75em; padding: 1.25em; width: 90%; max-width: 22em; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
  .edit-modal label { display: block; font-size: .75em; font-weight: 600; margin: .6em 0 .2em; }
  .edit-modal input { width: 100%; font: inherit; font-size: .9em; border: 1px solid var(--kzr-brand); border-radius: .3em; padding: .45em; color: var(--kzr-brand); }
  .edit-save { width: 100%; margin-top: 1em; background: var(--kzr-brand); color: var(--kzr-white); border: none; border-radius: .4em; padding: .6em; font: inherit; font-weight: 600; cursor: pointer; }
  .m-item-num { font-size: .7em; opacity: .3; min-width: 1.2em; text-align: center; }
  .m-item-weight { width: 4.5em; font: inherit; font-size: .85em; border: 1.5px solid transparent; border-radius: .3em; padding: .3em .4em; text-align: center; color: var(--kzr-brand); background: transparent; }
  .m-item-weight:focus { border-color: var(--kzr-brand); background: var(--kzr-white); }
  .m-item-weight::placeholder { opacity: .3; }
  .loading { text-align: center; padding: 3em; opacity: .4; }
</style>
</head>
<body>
<div class="page">
  <div class="header"><a href="../">←</a><h1 id="title">...</h1></div>
  <div class="cards">
    <div class="card" onclick="editSection('money')"><div class="card__row"><span class="card__label">Nákup</span><span class="card__val" id="v-purchase">—</span></div><div class="card__row"><span class="card__label">Prodej</span><span class="card__val" id="v-revenue">—</span></div><div class="card__row"><span class="card__label">Rozdáno</span><span class="card__val" id="v-given">—</span></div><div class="card__row"><span class="card__label">Výsledek</span><span class="card__val" id="v-profit">—</span></div></div>
    <div class="card" onclick="editSection('weight')"><div class="card__row"><span class="card__label">Živá</span><span class="card__val" id="v-live">—</span></div><div class="card__row"><span class="card__label">Mrtvá</span><span class="card__val" id="v-dead">—</span></div><div class="card__row"><span class="card__label">Rozbourané</span><span class="card__val" id="v-butchered">—</span></div></div>
    <div class="card" onclick="editSection('dates')"><div class="card__row"><span class="card__label">Porážka</span><span class="card__val card__val--small" id="v-slaughter">—</span></div><div class="card__row"><span class="card__label">Staří se</span><span class="card__val" id="v-aging-days">—</span></div><div class="card__row"><span class="card__label">Stav</span><span class="card__val card__val--small" id="v-status">—</span></div></div>
  </div>
  <div class="qfilter"><button class="qbtn active" data-q="all">Vše</button><button class="qbtn" data-q="predni">Přední</button><button class="qbtn" data-q="zadni">Zadní</button><button class="qbtn" data-q="vnitrnosti">Vnitřnosti</button><button class="qbtn" data-q="ostatni">Ostatní</button></div>
  <div class="parts" id="parts"><div class="loading">Načítám...</div></div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" id="mc"></div></div>

<div class="edit-overlay" id="overlay-money" onclick="if(event.target===this)this.classList.remove('is-open')"><div class="edit-modal"><label>Nákupní cena (Kč)</label><input type="number" id="e-purchase"><button class="edit-save" onclick="saveDrop('money')">Uložit</button></div></div>
<div class="edit-overlay" id="overlay-weight" onclick="if(event.target===this)this.classList.remove('is-open')"><div class="edit-modal"><label>Živá váha (kg)</label><input type="number" id="e-live"><label>Mrtvá váha (kg)</label><input type="number" id="e-dead"><label>Rozbouraná váha (kg)</label><input type="number" id="e-butchered"><button class="edit-save" onclick="saveDrop('weight')">Uložit</button></div></div>
<div class="edit-overlay" id="overlay-dates" onclick="if(event.target===this)this.classList.remove('is-open')"><div class="edit-modal"><label>Datum porážky</label><input type="date" id="e-slaughter"><button class="edit-save" onclick="saveDrop('dates')">Uložit</button></div></div>

<script>
var dropId=new URLSearchParams(location.search).get('drop'),drop={},products=[],parts=[],orders=[],activeQ='all',cp=null,showAdd=false;
var QM={'krk':'predni','krcni':'predni','plec':'predni','podpleci':'predni','hrud':'predni','karabacek':'predni','klizka':'predni','husic':'predni','rostenec':'predni','zebro':'predni','svickova':'zadni','kvetova':'zadni','sal':'zadni','orech':'zadni','ohanka':'zadni','pupek':'zadni','bryndacek':'zadni','flank':'zadni','oponka':'zadni','veverka':'zadni','osobuko':'zadni','valecek':'zadni','srdce':'vnitrnosti','jazyk':'vnitrnosti','licka':'vnitrnosti','mlete':'ostatni','burger':'ostatni'};
function Q(h){h=(h||'').toLowerCase();for(var k in QM)if(h.includes(k))return QM[k];return'ostatni';}
var CR={'krk':{en:'Chuck',v:''},'krcni':{en:'Chuck Tender',v:''},'hrud':{en:'Brisket',v:'https://youtu.be/QQ6UlUgo7OI'},'rostenec':{en:'Rib Eye/Strip',v:'https://youtu.be/OwoBIcCb4ik'},'podpleci':{en:'Chuck Eye',v:''},'plec':{en:'Shoulder',v:'https://youtu.be/BJSwm0IF8mY'},'karabacek':{en:'Shank Meat',v:''},'klizka':{en:'Shin',v:''},'svickova':{en:'Tenderloin',v:'https://youtu.be/Z9Z9I_9d4Xg'},'veverka':{en:'Hanger',v:'https://youtu.be/Fhc-2-CMCP4'},'kvetova':{en:'Picanha',v:''},'orech':{en:'Round',v:'https://youtu.be/cTfu1SIhhgM'},'sal':{en:'Silverside',v:''},'oponka':{en:'Skirt',v:'https://youtu.be/XqFvrb-KcHk'},'flank':{en:'Flank',v:''},'ohanka':{en:'Oxtail',v:''},'pupek':{en:'Belly',v:''},'zebro':{en:'Rib',v:''},'husic':{en:'Tri-Tip',v:''},'valecek':{en:'Eye of Round',v:''},'osobuko':{en:'Osso Buco',v:''},'licka':{en:'Cheeks',v:''},'srdce':{en:'Heart',v:''},'jazyk':{en:'Tongue',v:''},'mlete':{en:'Ground',v:''}};
function ref(h){h=(h||'').toLowerCase();for(var k in CR)if(h.includes(k))return CR[k];return null;}
function fD(i){if(!i)return'—';return new Date(i).toLocaleDateString('cs-CZ',{day:'numeric',month:'short',year:'numeric'});}
function dS(i){if(!i)return null;return Math.floor((Date.now()-new Date(i).getTime())/86400000);}
function res(h){var c=0;orders.forEach(function(o){if(!o.paidAt)return;(o.lines||[]).forEach(function(l){if(l.productHandle===h)c+=(l.quantity||1);});});return c;}
function gT(){var t=0;parts.filter(function(p){return p.status==='given'||p.status==='own';}).forEach(function(p){var pr=products.find(function(x){return x.id===p.productId;});if(pr)t+=pr.czkPrice||0;});return t;}

async function load(){if(!dropId)return;var[d,o]=await Promise.all([fetch('/api/drops/'+dropId).then(r=>r.json()),fetch('/api/orders').then(r=>r.json())]);drop=d.drop;products=d.products;parts=d.parts;orders=o;uI();rP();}
function uI(){
  document.getElementById('title').textContent=drop.name||'';
  var pu=drop.purchasePrice||0,rv=products.reduce(function(s,p){var cnt=parts.filter(function(x){return x.productId===p.id&&(!x.status||x.status==='aging');}).length;return s+(p.czkPrice||0)*cnt;},0),gi=gT(),pr=rv-gi-pu;
  document.getElementById('v-purchase').textContent=pu?pu.toLocaleString()+',-':'?';
  document.getElementById('v-revenue').textContent=rv.toLocaleString()+',-';
  document.getElementById('v-given').textContent=gi?gi.toLocaleString()+',-':'0';
  var pe=document.getElementById('v-profit');pe.textContent=(pr>0?'+':'')+pr.toLocaleString()+',-';pe.className='card__val '+(pr>0?'card__val--green':'card__val--red');
  document.getElementById('v-live').textContent=drop.totalWeight?drop.totalWeight+' kg':'?';
  document.getElementById('v-dead').textContent=drop.deadWeight?drop.deadWeight+' kg':'?';
  document.getElementById('v-butchered').textContent=drop.butcheredWeight?drop.butcheredWeight+' kg':'?';
  document.getElementById('v-slaughter').textContent=fD(drop.slaughterDate);
  var d2=dS(drop.slaughterDate);document.getElementById('v-aging-days').textContent=d2!==null?d2:'?';
  document.getElementById('v-status').textContent=drop.soldOutAt?'Prodáno':'Aktivní';
}
function rP(){
  var c=document.getElementById('parts');
  var f=products.filter(function(p){return activeQ==='all'||Q(p.handle)===activeQ;}).sort(function(a,b){return a.name.localeCompare(b.name);});
  c.innerHTML=f.map(function(p){
    var st=parts.filter(function(s){return s.productId===p.id;}),ag=st.filter(function(s){return!s.status||s.status==='aging';}).length,r=res(p.handle),fr=ag-r;if(fr<0)fr=0;
    return '<div class="part" onclick="oM(\''+p.id+'\')"><span class="part-name">'+p.name+'<span class="part-meta"> · '+p.czkPrice+',- · '+(p.weight||'')+'</span></span><div><div class="part-count">'+ag+'</div><div class="part-sub">'+(r?r+' rez.':'')+'</div></div></div>';
  }).join('');
}
function oM(pid){cp=products.find(function(x){return x.id===pid;});if(!cp)return;showAdd=false;rM();document.getElementById('modal').classList.add('is-open');document.body.style.overflow='hidden';}
function cM(){document.getElementById('modal').classList.remove('is-open');document.body.style.overflow='';cp=null;rP();uI();}

function rM(){
  var p=cp;if(!p)return;
  var r=ref(p.handle),st=parts.filter(function(s){return s.productId===p.id;}),ag=st.filter(function(s){return!s.status||s.status==='aging';}),rv=res(p.handle),fr=ag.length-rv;if(fr<0)fr=0;
  var at=p.agingType||'suché',am=p.agingMethod||'v kuse',od=p.optimalAgingDays||'';
  var rc=rv;st.forEach(function(s){s._r=false;});ag.forEach(function(s){if(rc>0){s._r=true;rc--;}});

  var sL={aging:'Zraje',frozen:'Zmrazeno',given:'Darováno',own:'Vlastní',reserved:'Rezervováno',sold:'Prodáno'};
  var sC={aging:'aging',frozen:'frozen',given:'given',own:'own',reserved:'reserved',sold:'sold'};

  var items=st.map(function(s,i){
    var t=s.status||'aging',dt=t;if(t==='aging'&&s._r)dt='reserved';
    return '<div class="m-item">'+
      '<span class="m-item-num">'+(i+1)+'</span>'+
      '<input type="number" step="0.1" class="m-item-weight" value="'+(s.weight||'')+'" placeholder="kg" onchange="uW(\''+s.id+'\',this.value)">'+
      '<span class="m-badge m-badge--'+sC[dt]+'">'+sL[dt]+'</span>'+
      '<div class="m-acts">'+
        (t==='aging'?'<button class="m-act m-act--freeze" onclick="sS(\''+s.id+'\',\'frozen\')">❄</button><button class="m-act m-act--give" onclick="sS(\''+s.id+'\',\'given\')">🎁</button><button class="m-act m-act--own" onclick="sS(\''+s.id+'\',\'own\')">🏠</button>':
        '<button class="m-act m-act--back" onclick="sS(\''+s.id+'\',\'aging\')">↩</button>')+
        '<button class="m-act m-act--del" onclick="rPt(\''+s.id+'\')">✕</button>'+
      '</div></div>';
  }).join('');

  document.getElementById('mc').innerHTML=
    '<div class="m-header"><span class="m-title">'+p.name+'</span><button class="m-close" onclick="cM()">×</button></div>'+
    '<div class="m-sub">'+p.czkPrice+',- · '+(p.weight||'')+(r?' · '+r.en:'')+'</div>'+

    (r?'<div class="m-media">'+
      '<a href="https://www.topbeef.cz/deleni-masa" target="_blank">📷 Fotka</a>'+
      (r.v?'<a href="'+r.v+'" target="_blank">🎬 Video</a>':'<a href="https://www.milujuhovezi.cz/Video-zpracovani-hoveziho-masa" target="_blank">🇨🇿 Bourání</a>')+
    '</div>':'')+

    '<div class="m-aging">'+
      '<button class="m-pill '+(at==='suché'?'active':'')+'" onclick="sA(\'agingType\',\'suché\')">Suché</button>'+
      '<button class="m-pill '+(at==='mokré'?'active':'')+'" onclick="sA(\'agingType\',\'mokré\')">Mokré</button>'+
      '<span class="m-aging-label">·</span>'+
      '<button class="m-pill '+(am==='v kuse'?'active':'')+'" onclick="sA(\'agingMethod\',\'v kuse\')">V kuse</button>'+
      '<button class="m-pill '+(am==='zvlášť'?'active':'')+'" onclick="sA(\'agingMethod\',\'zvlášť\')">Zvlášť</button>'+
      '<span class="m-aging-label">·</span>'+
      '<input type="number" class="m-aging-input" value="'+(od||'')+'" placeholder="d" onchange="sA(\'optimalAgingDays\',parseInt(this.value)||0)">'+
      '<span class="m-aging-label">dní</span>'+
    '</div>'+

    '<div class="m-pm">'+
      '<button class="m-pm-btn" onclick="qR()">−</button>'+
      '<div><div class="m-pm-count">'+ag.length+'</div><div class="m-pm-sub">'+(fr>0?fr+' voln.':'')+(rv?' '+rv+' rez.':'')+'</div></div>'+
      '<button class="m-pm-btn m-pm-btn--add" onclick="qA()">+</button>'+
    '</div>'+

    (st.length?'<div class="m-stock-title">Kusy</div>'+items:'')+

    '<div class="m-label"><label>Popis na etiketu</label><textarea onchange="sLD(this.value)">'+(p.labelDescription||'')+'</textarea></div>';
}

function qA(){if(!cp)return;fetch('/api/drops/'+dropId+'/parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:cp.id,productName:cp.name,weight:0,status:'aging'})}).then(function(r){return r.json();}).then(function(pt){parts.push(pt);rM();});}
function qR(){var p=cp;if(!p)return;var ag=parts.filter(function(s){return s.productId===p.id&&(!s.status||s.status==='aging');});if(!ag.length)return;rPt(ag[ag.length-1].id);}
async function uW(id,v){var w=parseFloat(v)||0;await fetch('/api/drops/'+dropId+'/parts/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:parts.find(function(x){return x.id===id;}).status||'aging'})});var p=parts.find(function(x){return x.id===id;});if(p)p.weight=w;/* save weight separately */await fetch('/api/drops/'+dropId+'/parts/'+id+'/weight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weight:w})});}
async function rPt(id){await fetch('/api/drops/'+dropId+'/parts/'+id,{method:'DELETE'});parts=parts.filter(function(x){return x.id!==id;});rM();}
async function sS(id,st){await fetch('/api/drops/'+dropId+'/parts/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st})});var p=parts.find(function(x){return x.id===id;});if(p)p.status=st;rM();}
async function sA(f,v){if(!cp)return;cp[f]=v;await fetch('/api/products/'+cp.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[f]:v})});rM();}
async function sLD(v){if(!cp)return;cp.labelDescription=v;await fetch('/api/products/'+cp.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({labelDescription:v})});}

load();
</script>
