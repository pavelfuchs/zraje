<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zraje — Admin</title>
<link rel="stylesheet" href="../style.css">
<style>
  body {
    background: var(--kzr-white);
    color: var(--kzr-brand);
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .admin {
    max-width: 28em;
    margin: 0 auto;
    padding: 1.5em 1em;
  }

  .admin-title {
    font-family: var(--font-germaniaone);
    font-size: 1.4em;
    font-weight: 400;
    text-align: center;
    margin-bottom: 1.5em;
  }

  /* Product tiles */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(7em, 1fr));
    gap: .75em;
    margin-bottom: 2em;
  }

  .tile {
    aspect-ratio: 1;
    border-radius: .75em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5em;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
    text-decoration: none;
    background: var(--kzr-grey);
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    position: relative;
  }

  .tile:hover, .tile:active {
    background: var(--kzr-light);
    box-shadow: 0 0 0 2px var(--kzr-brand);
  }

  .tile__icon {
    width: 2.5em;
    height: auto;
    color: var(--kzr-brand);
  }

  .tile__label {
    font-size: .8em;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
  }

  .tile__badge {
    position: absolute;
    top: .4em;
    right: .4em;
    font-size: .55em;
    font-weight: 600;
    background: var(--kzr-brand);
    color: var(--kzr-white);
    padding: .15em .45em;
    border-radius: 1em;
  }

  .tile--add {
    border: 2px dashed var(--kzr-brand);
    background: transparent;
    opacity: .5;
  }

  .tile--add:hover {
    opacity: 1;
    background: var(--kzr-light);
  }

  .tile--add .tile__icon {
    font-size: 2em;
    width: auto;
  }

  /* Section links */
  .sections {
    display: flex;
    flex-direction: column;
    gap: .75em;
  }

  .section-link {
    display: flex;
    align-items: center;
    gap: 1em;
    padding: 1.25em 1em;
    border-radius: .5em;
    background: var(--kzr-white);
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
    text-decoration: none;
    color: var(--kzr-brand);
    font-weight: 600;
    font-size: 1.1em;
    transition: background .15s, box-shadow .15s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .section-link:hover, .section-link:active {
    background: var(--kzr-light);
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }

  .section-link__icon {
    font-size: 1.6em;
    width: 1.6em;
    text-align: center;
    flex-shrink: 0;
  }

  /* Past drops */
  .past-toggle {
    display: block;
    width: 100%;
    text-align: center;
    font: inherit;
    font-size: .75em;
    color: var(--kzr-brand);
    opacity: .4;
    background: none;
    border: none;
    cursor: pointer;
    padding: .5em;
    margin-top: -.5em;
    margin-bottom: 1em;
  }

  .past-toggle:hover { opacity: .7; }

  .past-drops {
    display: none;
    margin-top: .5em;
    margin-bottom: 1.5em;
  }

  .past-drops.is-open { display: grid; }
  .past-drops .tile { opacity: .4; }
  .past-drops .tile:hover { opacity: .7; }
</style>
</head>
<body>
  <div class="admin">
    <h1 class="admin-title">zraje</h1>

    <!-- Active tiles -->
    <div class="tiles" id="active-tiles">
      <!-- Filled from JS -->
    </div>

    <button class="past-toggle" id="past-toggle" style="display:none" onclick="document.getElementById('past-drops').classList.toggle('is-open'); this.textContent = document.getElementById('past-drops').classList.contains('is-open') ? 'Skrýt proběhlé ▲' : 'Proběhlé ▼'">Proběhlé ▼</button>

    <div class="past-drops tiles" id="past-drops">
      <!-- Past drops -->
    </div>

    <!-- Sections -->
    <div class="sections">
      <a class="section-link" href="bourani/">
        <span class="section-link__icon">🔪</span>
        <span>Bourání</span>
      </a>
      <a class="section-link" href="objednavky/" style="position:relative">
        <span class="section-link__icon">📦</span>
        <span>Objednávky</span>
        <span id="orders-badge" style="display:none;position:absolute;top:.5em;right:.5em;background:var(--kzr-brand);color:var(--kzr-white);font-size:.6em;font-weight:700;padding:.2em .5em;border-radius:1em"></span>
      </a>
      <a class="section-link" href="kontakty/">
        <span class="section-link__icon">👥</span>
        <span>Kontakty</span>
      </a>
    </div>
  </div>

  <script>

    fetch('/api/drops')
      .then(r => r.json())
      .then(drops => {
        // Sort by name, latest first
        drops.sort((a, b) => b.name.localeCompare(a.name));

        var activeTiles = document.getElementById('active-tiles');
        var pastDrops = document.getElementById('past-drops');
        var pastToggle = document.getElementById('past-toggle');

        // Latest drop = first tile (active)
        if (drops.length > 0) {
          var latest = drops[0];
          activeTiles.innerHTML =
            '<a class="tile" href="bourani/?drop=' + latest.id + '">' +
              cowSvg +
              '<span class="tile__label">' + latest.name + '</span>' +
              '<span class="tile__badge">aktivní</span>' +
            '</a>' +
            '<a class="tile" href="#">' +
              '<span class="tile__icon" style="font-size:1.5em">🫙</span>' +
              '<span class="tile__label">Ocet</span>' +
            '</a>' +
            '<a class="tile tile--add" onclick="alert(\'Přidat nový drop\'); return false;" href="#">' +
              '<span class="tile__icon">+</span>' +
              '<span class="tile__label">Přidat</span>' +
            '</a>';
        }

        // Past drops
        if (drops.length > 1) {
          pastToggle.style.display = '';
          pastDrops.innerHTML = drops.slice(1).map(drop =>
            '<a class="tile" href="bourani/?drop=' + drop.id + '">' +
              cowSvg +
              '<span class="tile__label">' + drop.name + '</span>' +
            '</a>'
          ).join('');
        }
      });

    // Load new orders count for badge
    fetch('/api/orders/count/new')
      .then(r => r.json())
      .then(data => {
        if (data.count > 0) {
          var badge = document.getElementById('orders-badge');
          badge.textContent = data.count;
          badge.style.display = '';
        }
      });
  </script>
</body>
</html>
